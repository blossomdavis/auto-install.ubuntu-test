#cloud-init
autoinstall:
  version: 1
  identity:
    hostname: blossom.boll
    username: blossom-auto
    realname: "blossom"
    password: "$1$ffQS0q8R$ix/w0XHjfNSn1B.ogzXaS0"

  drivers:
    install: true
  codecs:
    install: true
  packages:
    - virtualbox
    - vim
    - kdenlive
    - alacritty
    - whois
    - git
    - curl
    - wget 
    - tmux
    - unzip
    - htop
    - build-essential
    - python3
    - ubuntu-desktop 
    - vlc
    - ufw
    - obs-studio
    - nfs-common
    - libreoffice
    - linux-firmware-nonfree
  snaps: 
    - name: brave
    - name: discord
    - name: spotify
      

  locale: sv_SE.UTF-8 
  timezone: Europe/Stockholm
  keyboard: 
    layout: se

  ssh:
    install-server: true
    allow-pw: false
  user-data:
    users: 
      - default
      - name: blossom-auto
        gecos: "blossom"
        groups: [sudo, adm, lxd]
        shell: /bin/bash
        sudo: ALL=(ALL:ALL) ALL
        lock-passwd: false
  storage:
    layout:
      name: direct
    config:
      - type: disk
        id: disk0
        match:
          size: largest
        ptable: gpt
        wipe: superblock-recursive
        preserve: false
        name: ""
        grub_device: true

      - type: partition
        id: esp
        device: disk0
        size: 1024M
        flag: boot
        grub_device: false

      - type: format
        id: esp-format
        volume: esp
        fstype: fat32

      - type: mount
        id: esp-mount
        device: esp-format
        path: /boot/efi

      - type: partition
        id: swap
        device: disk0
        size: 8192M

      - type: format
        id: swap-format
        volume: swap
        fstype: swap

      - type: partition
        id: root
        device: disk0
        size: -1

      - type: format
        id: root-format
        volume: root
        fstype: ext4

      - type: mount
        id: root-mount
        device: root-format
        path: /

